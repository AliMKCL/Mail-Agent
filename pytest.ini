[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    unit: pure-unit tests for a single service, no HTTP hop
    contract: in-process contract tests for one service's wire surface
    e2e: needs the six services plus the Go server and the rate limiter listening; deselect in CI with -m "not e2e"
    golden: golden-file parity replay through the Gateway; the arbiter of behavioural correctness
